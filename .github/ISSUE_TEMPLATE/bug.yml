name: Bug report
description: One of the tools did the wrong thing.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Use a short fake example. Do not paste real tokens, secrets, or private source.
  - type: dropdown
    id: tool
    attributes:
      label: Tool
      options:
        - JSON
        - Timestamps
        - Line diff
        - Base64
        - URL encoding
        - JWT decode
        - UUID
        - Other
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
      placeholder: |
        1. Open JSON.
        2. Paste { "a": 1 }.
        3. Format it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: Firefox 134 on Linux
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: This report uses a fake example and contains no real token or private source.
          required: true
